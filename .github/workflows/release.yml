name: Release

on:
  push:
    tags:
      - v*

permissions:
  contents: read

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version-without-v }}
      prerelease: ${{ steps.get-version.outputs.prerelease != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history, so the script can check the tagged commit is on master
          fetch-depth: 0
      - name: Get version from tag
        id: get-version
        uses: battila7/get-version-action@v2
      - name: Validate release
        env:
          TAG_VERSION: ${{ steps.get-version.outputs.version-without-v }}
        run: ./scripts/validate-release.sh "${TAG_VERSION}"

  package:
    name: Package ${{ matrix.platform }}
    needs: validate
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux-x64-gnu
            os: ubuntu-22.04
          - platform: linux-x64-musl
            os: ubuntu-latest
            container: alpine:latest
          - platform: windows-x64
            os: windows-latest
            cmake_args: -A x64
          - platform: windows-x86
            os: windows-latest
            cmake_args: -A Win32
          - platform: macos-arm64
            os: macos-latest
            cmake_args: -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          - platform: macos-x64
            os: macos-15-intel
            cmake_args: -DCMAKE_OSX_ARCHITECTURES=x86_64 -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15
    defaults:
      run:
        shell: bash
    steps:
      - name: Install Alpine dependencies
        if: matrix.container == 'alpine:latest'
        shell: sh
        run: apk add --no-cache bash build-base cmake git linux-headers

      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DEOLIB_PACKAGE_PLATFORM=${{ matrix.platform }}
          ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure --parallel 4

      - name: Package
        working-directory: build
        run: cpack -C Release

      - uses: actions/upload-artifact@v7
        with:
          name: eolib-${{ needs.validate.outputs.version }}-${{ matrix.platform }}
          path: |
            build/eolib-*.zip
            build/eolib-*.tar.gz
            build/eolib-*.sha256
          if-no-files-found: error

  source:
    name: Source archive
    needs: validate
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Create source archive
        run: |
          # Includes the submodule contents, so the archive can be built without git (e.g. by package managers).
          name="eolib-${VERSION}-src"
          git ls-files --recurse-submodules -z \
            | tar --null --files-from=- --transform "s,^,${name}/," -czf "${name}.tar.gz"
          sha512sum "${name}.tar.gz" > "${name}.tar.gz.sha512"
          cat "${name}.tar.gz.sha512"
      - uses: actions/upload-artifact@v7
        with:
          name: eolib-${{ needs.validate.outputs.version }}-src
          path: |
            eolib-*-src.tar.gz
            eolib-*-src.tar.gz.sha512
          if-no-files-found: error

  docs:
    name: Docs
    needs: validate
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install Doxygen
        run: sudo ./scripts/install-deps.sh --skip-cmake --skip-style-tools --docs
      - name: Build docs
        run: ./scripts/build-docs.sh --warnings-as-errors --archive "eolib-${VERSION}-docs.tar.gz"
      - uses: actions/upload-artifact@v7
        with:
          name: eolib-${{ needs.validate.outputs.version }}-docs
          path: eolib-*-docs.tar.gz
          if-no-files-found: error

  github-release:
    name: GitHub release
    needs: [validate, package, source, docs]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Parse changelog
        id: changelog
        uses: coditory/changelog-parser@v1
        with:
          version: ${{ needs.validate.outputs.version }}
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: eolib v${{ needs.validate.outputs.version }}
          body: ${{ steps.changelog.outputs.description }}
          prerelease: ${{ needs.validate.outputs.prerelease }}
          files: dist/*
          fail_on_unmatched_files: true
